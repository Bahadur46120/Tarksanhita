<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tarksanhita — home page banner illustration.

  A speaker addressing the house from the lectern, with the two teams at their
  desks and the house behind them. Flat vector in the brand palette, set on a
  pale ground so it sits under the light banner and fades in from the left.

  TO REPLACE WITH A PHOTOGRAPH: save a wide image (about 1200x560, 15:7) as
  banner.jpg in this folder and change the one src in home.html. Nothing else
  needs to change.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 560"
     width="1200" height="560"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-labelledby="banner-title">
  <title id="banner-title">A member addressing the house from the lectern, with the two teams at their desks and the house seated behind</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#dde7f4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98b3f"/>
      <stop offset="1" stop-color="#8a6524"/>
    </linearGradient>
    <radialGradient id="wash" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#7ea3cf" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7ea3cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#sky)"/>
  <ellipse cx="620" cy="250" rx="470" ry="270" fill="url(#wash)"/>

  <!-- ===================== the house, seated behind ===================== -->
  <g fill="#1e4a7a" opacity=".20">
    <g>
      <circle cx="180" cy="352" r="26"/><path d="M144 430v-36a36 36 0 0 1 72 0v36z"/>
      <circle cx="268" cy="338" r="24"/><path d="M235 430v-38a33 33 0 0 1 66 0v38z"/>
      <circle cx="352" cy="356" r="26"/><path d="M316 430v-34a36 36 0 0 1 72 0v34z"/>
      <circle cx="440" cy="340" r="24"/><path d="M407 430v-38a33 33 0 0 1 66 0v38z"/>
      <circle cx="760" cy="340" r="24"/><path d="M727 430v-38a33 33 0 0 1 66 0v38z"/>
      <circle cx="846" cy="356" r="26"/><path d="M810 430v-34a36 36 0 0 1 72 0v34z"/>
      <circle cx="936" cy="338" r="24"/><path d="M903 430v-38a33 33 0 0 1 66 0v38z"/>
      <circle cx="1022" cy="354" r="26"/><path d="M986 430v-36a36 36 0 0 1 72 0v36z"/>
    </g>
    <!-- hands raised to speak -->
    <g>
      <rect x="212" y="286" width="17" height="46" rx="8"/>
      <rect x="404" y="272" width="17" height="52" rx="8"/>
      <rect x="796" y="280" width="17" height="48" rx="8"/>
      <rect x="972" y="268" width="17" height="54" rx="8"/>
    </g>
  </g>
  <g fill="#17395f" opacity=".13">
    <circle cx="224" cy="392" r="27"/><path d="M186 466v-32a38 38 0 0 1 76 0v32z"/>
    <circle cx="316" cy="398" r="27"/><path d="M278 466v-30a38 38 0 0 1 76 0v30z"/>
    <circle cx="884" cy="396" r="27"/><path d="M846 466v-30a38 38 0 0 1 76 0v30z"/>
    <circle cx="978" cy="392" r="27"/><path d="M940 466v-32a38 38 0 0 1 76 0v32z"/>
  </g>

  <!-- ===================== the member speaking ===================== -->
  <!-- gesturing arm, drawn first so the body overlaps it cleanly -->
  <path d="M648 300c34-6 58-26 74-52" stroke="#102743" stroke-width="21" fill="none" stroke-linecap="round"/>
  <circle cx="731" cy="240" r="15" fill="#e6d3b6"/>

  <!-- body -->
  <path d="M528 386v-70a72 72 0 0 1 144 0v70z" fill="#102743"/>
  <!-- shirt and tie -->
  <path d="M576 250h48l-24 46z" fill="#ffffff"/>
  <path d="M596 262h8l8 22-12 26-12-26z" fill="#a8861c"/>
  <!-- head -->
  <circle cx="600" cy="206" r="42" fill="#e6d3b6"/>
  <path d="M558 198a42 42 0 0 1 84 0c0-30-18-44-42-44s-42 14-42 44z" fill="#1a1a24"/>

  <!-- microphone on its stem -->
  <g stroke="#3b4a5e" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M676 372l-34-58"/>
  </g>
  <rect x="628" y="286" width="16" height="30" rx="8" fill="#2b3646" transform="rotate(28 636 301)"/>

  <!-- lectern -->
  <path d="M512 372h176l-16 148H528z" fill="url(#wood)"/>
  <rect x="500" y="360" width="200" height="18" rx="4" fill="#a8861c"/>
  <path d="M548 412h104v40H548z" fill="#000000" opacity=".10"/>

  <!-- ===================== team desks ===================== -->
  <!-- left: Team A -->
  <g>
    <circle cx="196" cy="404" r="30" fill="#e6d3b6"/>
    <path d="M166 398a30 30 0 0 1 60 0c0-24-14-34-30-34s-30 10-30 34z" fill="#241a14"/>
    <path d="M144 470v-24a52 52 0 0 1 104 0v24z" fill="#16324f"/>
    <path d="M182 442h28l-14 26z" fill="#ffffff"/>
  </g>
  <rect x="76" y="470" width="300" height="14" rx="3" fill="#8a6524"/>
  <rect x="88" y="484" width="276" height="60" fill="#b98b3f"/>
  <rect x="152" y="440" width="112" height="32" rx="3" fill="#ffffff" stroke="#c8d3e2" stroke-width="2"/>
  <text x="208" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" letter-spacing="2" fill="#102743">TEAM A</text>

  <!-- right: Team B -->
  <g>
    <circle cx="1004" cy="404" r="30" fill="#e6d3b6"/>
    <path d="M974 398a30 30 0 0 1 60 0c0-24-14-34-30-34s-30 10-30 34z" fill="#1a1a24"/>
    <path d="M952 470v-24a52 52 0 0 1 104 0v24z" fill="#16324f"/>
    <path d="M990 442h28l-14 26z" fill="#ffffff"/>
  </g>
  <rect x="824" y="470" width="300" height="14" rx="3" fill="#8a6524"/>
  <rect x="836" y="484" width="276" height="60" fill="#b98b3f"/>
  <rect x="936" y="440" width="112" height="32" rx="3" fill="#ffffff" stroke="#c8d3e2" stroke-width="2"/>
  <text x="992" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" letter-spacing="2" fill="#102743">TEAM B</text>

  <!-- floor -->
  <rect x="0" y="544" width="1200" height="16" fill="#c9a227" opacity=".55"/>
</svg>
